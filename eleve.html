<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>EPS-Arena | Élève</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { getPerformancePath } from './src/js/core/firebase-service.js';
        import { calculateClimbingPoints } from './src/js/modules/escalade/escalade-calculations.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-app.js";
        import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-database.js";
        import { BAREME_ESCALADE } from './src/js/config/constants.js';

        const firebaseConfig = { databaseURL: "https://eps-arena-default-rtdb.europe-west1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let selectedClass = "";
        let selectedCode = "";
        let currentConfig = null;

        const BAREME = BAREME_ESCALADE;

        // Éléments du DOM
        const classSelect = document.getElementById('class-select');
        const waitingScreen = document.getElementById('waiting-screen');
        const loginScreen = document.getElementById('login-screen');
        const activityScreen = document.getElementById('activity-screen');
        const codeList = document.getElementById('code-list');
        const activityTitle = document.getElementById('activity-title');
        const escaladeModule = document.getElementById('escalade-module');
        const coModule = document.getElementById('co-module');
        const multiModule = document.getElementById('multi-module');
        // Récupération des classes disponibles (nouvelle structure)
const profCode = localStorage.getItem('eps_arena_profCode') || 'DEFAULT';
const activeClassesRef = ref(db, `etablissements/0680013V/profs/${profCode}/active_classes`);

onValue(activeClassesRef, (snap) => {
    const data = snap.val() || {};
    classSelect.innerHTML = '<option value="">-- Choisir la classe --</option>' + 
        Object.keys(data).map(c => `<option value="${c}">${c}</option>`).join('');
});

        classSelect.addEventListener('change', () => {
            selectedClass = classSelect.value;
            if (!selectedClass) return;
            
            // ✅ Nouvelle structure hiérarchique
    const profCode = localStorage.getItem('eps_arena_profCode') || 'DEFAULT';
    const configRef = ref(db, `etablissements/0680013V/profs/${profCode}/${selectedClass}/config`);

    onValue(configRef, (snap) => {
        currentConfig = snap.val();
        console.log("📡 Config reçue par l'élève :", currentConfig); // Diagnostic
        if (currentConfig) {
            showLogin();
        } else {
            showWaiting();
        }
    });
        });

        function showWaiting() {
            loginScreen.classList.add('hidden');
            activityScreen.classList.add('hidden');
            waitingScreen.classList.remove('hidden');
        }

        function showLogin() {
            waitingScreen.classList.add('hidden');
            activityScreen.classList.add('hidden');
            loginScreen.classList.remove('hidden');
            
            codeList.innerHTML = '';
            const config = currentConfig;
            activityTitle.innerText = "Choisis ton code";

            if (!config) {
                codeList.innerHTML = '<p class="text-red-400 text-center">Aucune activité transmise.<br>Veuillez patienter...</p>';
                return;
            }

            Object.keys(config).forEach(key => {
                if (key === 'activite') return;
                
                let count = 0;
                if (typeof config[key] === 'number') {
                    count = config[key];
                } else if (Array.isArray(config[key])) {
                    count = config[key].length;
                }
                
                for (let i = 0; i < count; i++) {
                    const code = `${key}${i + 1}`;
                    const btn = document.createElement('button');
                    btn.className = "bg-blue-600 p-4 rounded-xl font-black text-white text-xl";
                    btn.innerText = code;
                    btn.onclick = () => selectCode(code);
                    codeList.appendChild(btn);
                }
            });
        }

        function selectCode(code) {
            selectedCode = code;
            document.getElementById('selected-code').innerText = code;
            loginScreen.classList.add('hidden');
            activityScreen.classList.remove('hidden');

            escaladeModule.classList.add('hidden');
            coModule.classList.add('hidden');
            multiModule.classList.add('hidden');

            if (currentConfig.activite === 'escalade') {
                escaladeModule.classList.remove('hidden');
                initEscaladeUI();
            } else if (currentConfig.activite === 'co') {
                coModule.classList.remove('hidden');
            } else {
                multiModule.classList.remove('hidden');
            }
        }

        function initEscaladeUI() {
            const cotationGrid = document.getElementById('cotation-grid');
            cotationGrid.innerHTML = '';
            
            Object.keys(BAREME).forEach(cot => {
                const btn = document.createElement('button');
                btn.className = "bg-slate-700 p-3 rounded-xl font-black text-white border-2 border-slate-500";
                btn.innerText = cot.toUpperCase();
                btn.dataset.cotation = cot;
                btn.onclick = () => {
                    cotationGrid.querySelectorAll('button').forEach(b => b.classList.remove('bg-blue-600', 'border-white'));
                    btn.classList.add('bg-blue-600', 'border-white');
                };
                cotationGrid.appendChild(btn);
            });

            const defaultBtn = cotationGrid.querySelector('button[data-cotation="5a"]');
            if (defaultBtn) {
                defaultBtn.classList.add('bg-blue-600', 'border-white');
            }

            document.getElementById('voie-select').value = "1";
            document.getElementById('hauteur-select').value = "9";
        }

        // ✅ FONCTION CORRIGÉE : UN SEUL ENVOI AU BON CHEMIN
        window.sendEscalade = async function() {
            const voie = document.getElementById('voie-select').value;
            const couleur = document.getElementById('couleur-select').value;
            const hauteur = parseFloat(document.getElementById('hauteur-select').value);
            const selectedCotationBtn = document.querySelector('#cotation-grid button.bg-blue-600');
            const cotation = selectedCotationBtn ? selectedCotationBtn.dataset.cotation : '5a';
            
            // Calcul unifié
            const points = calculateClimbingPoints({ hauteur, cotation, couleur, essai: 1 });

            // Chemin unifié
            const chemin = getPerformancePath(selectedClass, 'escalade');

            // Un seul push propre
            await push(ref(db, chemin), {
                groupe: selectedCode.slice(0, -1),
                role: selectedCode.slice(-1),
                voie_num: voie,
                couleur: couleur,
                cotation: cotation,
                hauteur: hauteur,
                points: points,
                timestamp: Date.now()
            });

            showFeedback(`Montée : Voie ${voie} - ${hauteur}m<br>Points : ${points} m !`, 5000);
        };

        window.sendBalise = async function() {
            const balise = document.getElementById('balise-input').value.trim();
            if (!balise) return alert("Entrez un numéro de balise.");
            await push(ref(db, `${selectedClass}/co/validations`), {
                code: selectedCode, balise: balise, timestamp: Date.now()
            });
            showFeedback("Balise vérifiée !", 3000);
        };

        let chronoInterval = null;
        let chronoStart = 0;
        window.startChrono = function() {
            const display = document.getElementById('chrono-display');
            chronoStart = Date.now();
            if (chronoInterval) clearInterval(chronoInterval);
            chronoInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - chronoStart) / 1000);
                const min = Math.floor(elapsed / 60);
                const sec = elapsed % 60;
                display.innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
            }, 1000);
            document.getElementById('start-btn').classList.add('hidden');
            document.getElementById('stop-btn').classList.remove('hidden');
        };

        window.stopChrono = async function() {
            clearInterval(chronoInterval);
            const display = document.getElementById('chrono-display');
            const temps = display.innerText;
            await push(ref(db, `${selectedClass}/multi/performances`), {
                code: selectedCode, temps: temps, timestamp: Date.now()
            });
            showFeedback(`Temps enregistré : ${temps}`, 5000);
        };

        function showFeedback(message, delay = 5000) {
            const feedbackDiv = document.createElement('div');
            feedbackDiv.id = 'feedback-overlay';
            feedbackDiv.className = 'fixed inset-0 bg-black/90 flex flex-col items-center justify-center z-50 p-6';
            feedbackDiv.innerHTML = `
                <div class="text-6xl mb-4">✅</div>
                <p class="text-2xl font-black text-center mb-4">${message}</p>
                <p class="text-sm text-slate-400 mb-8">Montagne d'équipe dans <span id="feedback-countdown">5</span>s</p>
            `;
            document.body.appendChild(feedbackDiv);

            let countdown = 5;
            const countdownEl = feedbackDiv.querySelector('#feedback-countdown');
            const interval = setInterval(() => {
                countdown--;
                countdownEl.textContent = countdown;
                if (countdown <= 0) {
                    clearInterval(interval);
                    feedbackDiv.remove();
                    showTeamMountain();
                }
            }, 1000);
        }

        function showTeamMountain() {
    const mountainDiv = document.createElement('div');
    mountainDiv.id = 'team-mountain-overlay';
    mountainDiv.className = 'fixed inset-0 bg-black/90 flex flex-col items-center justify-center z-50 p-6';
    
    // 1. On construit la structure AVANT de lire Firebase
    mountainDiv.innerHTML = `
        <p class="text-2xl font-black mb-4">⛰️ Montagne de l'équipe</p>
        <div class="content mt-6"></div>
        <p class="text-sm text-slate-400 mt-4 mb-8">Retour au choix du code dans <span id="mountain-countdown">5</span>s</p>
    `;
    document.body.appendChild(mountainDiv);

    // 2. Puis on lit les données et on remplit le contenu
    const monteesRef = ref(db, getPerformancePath(selectedClass, 'escalade'));
    onValue(monteesRef, (snap) => {
        const montees = snap.val() || {};
        const equipeScores = {};
        Object.values(montees).forEach(m => {
            const lettre = m.groupe;
            if (!equipeScores[lettre]) equipeScores[lettre] = 0;
            equipeScores[lettre] += (m.points || 0);
        });

        const maxScore = Math.max(...Object.values(equipeScores), 1);
        let html = `<div class="w-full max-w-md h-64 relative overflow-hidden rounded-2xl bg-gradient-to-t from-slate-900 to-slate-600">`;
        html += `<div class="absolute bottom-0 left-0 right-0 h-1/4 bg-slate-800"></div>`;
        html += `<div class="absolute bottom-1/4 left-0 right-0 h-1/4 bg-slate-700"></div>`;
        html += `<div class="absolute bottom-1/2 left-0 right-0 h-1/4 bg-slate-600"></div>`;
        html += `<div class="absolute bottom-3/4 left-0 right-0 h-1/4 bg-slate-500"></div>`;
        html += `<div class="relative z-10 flex justify-around items-end pb-2 h-full">`;
        Object.keys(equipeScores).forEach(lettre => {
            const score = equipeScores[lettre];
            const height = Math.max((score / maxScore) * 80, 5);
            html += `
                <div class="flex flex-col items-center justify-end" style="transform: translateY(-${height}%);">
                    <div class="text-4xl">🧗</div>
                    <div class="bg-blue-500 text-white font-black px-3 py-1 rounded-lg">${lettre}</div>
                    <div class="text-yellow-400 font-bold">${score.toFixed(0)}m</div>
                </div>`;
        });
        html += `</div></div>`;

        mountainDiv.querySelector('.content').innerHTML = html;
    });

    // Compte à rebours 5s
    let countdown = 5;
    const countdownEl = mountainDiv.querySelector('#mountain-countdown');
    const interval = setInterval(() => {
        countdown--;
        countdownEl.textContent = countdown;
        if (countdown <= 0) {
            clearInterval(interval);
            mountainDiv.remove();
            showLogin();
        }
    }, 1000);
}

        window.quitActivity = function() {
            location.reload();
        };

        showWaiting();
    </script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6 font-sans">

    <div class="max-w-md mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black text-blue-500 italic">EPS-Arena</h1>
            <select id="class-select" class="bg-slate-800 border border-slate-600 rounded-lg p-2 text-xs font-bold text-blue-400 outline-none">
                <option value="">-- Classe --</option>
            </select>
        </div>

        <div id="waiting-screen" class="text-center py-20">
            <div class="text-6xl mb-6">⏳</div>
            <p class="text-slate-400 font-bold">En attente de l'activité<br>du professeur...</p>
        </div>

        <div id="login-screen" class="hidden">
            <h2 id="activity-title" class="text-xl font-black text-center mb-6">Choisis ton code</h2>
            <div id="code-list" class="grid grid-cols-3 gap-3"></div>
        </div>

        <div id="activity-screen" class="hidden">
            <div class="flex justify-between items-center mb-6 bg-slate-800 p-4 rounded-2xl border border-slate-700">
                <div>
                    <h2 class="text-xs uppercase text-slate-400 font-bold">Code sélectionné</h2>
                    <span id="selected-code" class="text-3xl font-black text-blue-400">--</span>
                </div>
                <button onclick="quitActivity()" class="bg-red-600 px-4 py-2 rounded-xl font-bold text-xs text-white active:scale-95">✖ Quitter</button>
            </div>

            <!-- MODULE ESCALADE -->
            <div id="escalade-module" class="hidden space-y-4">
                <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                    <label class="text-xs font-bold text-slate-400 uppercase">N° Voie (1 à 21)</label>
                    <select id="voie-select" class="w-full bg-slate-900 p-3 rounded-xl text-white text-2xl font-black mb-4 border border-slate-600">
                        <script>
                            for(let i = 1; i <= 21; i++) {
                                document.write(`<option value="${i}">Voie ${i}</option>`);
                            }
                        </script>
                    </select>

                    <label class="text-xs font-bold text-slate-400 uppercase">Couleur des prises</label>
                    <select id="couleur-select" class="w-full bg-slate-900 p-3 rounded-xl text-white mb-4 border border-slate-600">
                        <option value="bleue">Bleue</option>
                        <option value="rouge">Rouge</option>
                        <option value="verte">Verte</option>
                        <option value="jaune">Jaune</option>
                        <option value="rose">Rose</option>
                        <option value="orange">Orange</option>
                        <option value="sable">Sable</option>
                        <option value="tc">TC (Toutes Couleurs)</option>
                    </select>

                    <label class="text-xs font-bold text-slate-400 uppercase">Hauteur grimpée (m)</label>
                    <select id="hauteur-select" class="w-full bg-slate-900 p-3 rounded-xl text-white text-2xl font-black mb-4 border border-slate-600">
                        <option value="3">3m (Ligne de bloc)</option>
                        <option value="4">4m</option>
                        <option value="5">5m</option>
                        <option value="6">6m</option>
                        <option value="7">7m</option>
                        <option value="8">8m</option>
                        <option value="9" selected>9m (Top)</option>
                    </select>

                    <label class="text-xs font-bold text-slate-400 uppercase">Cotation (Points)</label>
                    <div id="cotation-grid" class="grid grid-cols-5 gap-2 mb-4"></div>

                    <button onclick="sendEscalade()" class="w-full bg-emerald-600 py-5 rounded-3xl text-xl font-black uppercase shadow-xl active:scale-95 transition-all">📤 Envoyer la montée</button>
                </div>
            </div>

            <!-- MODULE CO -->
            <div id="co-module" class="hidden space-y-4">
                <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                    <label class="text-xs font-bold text-slate-400 uppercase">Numéro de la balise</label>
                    <input type="text" id="balise-input" placeholder="Ex: 31, 45..." class="w-full bg-slate-900 p-4 rounded-xl text-white text-2xl font-black text-center mb-4 border border-slate-600">
                    <button onclick="sendBalise()" class="w-full bg-blue-600 py-5 rounded-3xl text-xl font-black uppercase shadow-xl active:scale-95 transition-all">✅ Valider la balise</button>
                </div>
            </div>

            <!-- MODULE MULTI-ACTIVITÉS (CHRONO) -->
            <div id="multi-module" class="hidden space-y-4">
                <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 text-center">
                    <div id="chrono-display" class="text-8xl font-black tabular-nums text-yellow-400 mb-8">00:00</div>
                    <button id="start-btn" onclick="startChrono()" class="w-full bg-emerald-600 py-5 rounded-3xl text-2xl font-black uppercase shadow-xl active:scale-95 transition-all mb-2">▶ Démarrer</button>
                    <button id="stop-btn" onclick="stopChrono()" class="hidden w-full bg-red-600 py-5 rounded-3xl text-2xl font-black uppercase shadow-xl active:scale-95 transition-all">⏹ Arrêter</button>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
