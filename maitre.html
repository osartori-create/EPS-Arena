<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>EPS-Arena | Professeur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; user-select: none; }
        .tab-active { border-bottom: 4px solid #3b82f6; color: #3b82f6 !important; font-weight: 900; }
        .btn { padding: 10px 16px; border-radius: 12px; font-weight: 800; border: none; cursor: pointer; transition: transform 0.1s; }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-success { background: #22c55e; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 12px; }
    </style>
</head>
<body class="p-4">

    <header class="flex justify-between items-center mb-4 border-b border-slate-800 pb-4 flex-wrap gap-4">
        <div class="flex items-center gap-3">
            <h1 class="text-2xl font-black text-blue-500 uppercase italic">EPS-Arena</h1>
            <span class="text-[10px] font-black uppercase text-slate-400 border border-slate-700 px-2 py-0.5 rounded-full bg-slate-900">Espace Professeur</span>
        </div>
        <div class="flex items-center gap-3">
            <span id="connDot" class="w-3 h-3 rounded-full bg-slate-600"></span>
            <span id="connLabel" class="text-xs font-bold uppercase text-slate-500">Connexion...</span>
            <select id="selectClasse" class="bg-slate-800 border border-slate-600 rounded px-3 py-1 text-xs font-bold text-white outline-none">
                <option value="">-- Classe --</option>
            </select>
            <button onclick="addClasse()" class="btn btn-primary text-xs uppercase">+ Classe</button>
        </div>
    </header>

    <nav class="flex border-b border-slate-800 mb-6 font-bold text-xs uppercase tracking-widest overflow-x-auto">
        <button id="btnTab1" onclick="switchTab('admin')" class="px-4 py-2 text-slate-500 tab-active text-blue-500 whitespace-nowrap">👨‍🏫 Administration</button>
        <button id="btnTab2" onclick="switchTab('activities')" class="px-4 py-2 text-slate-500 whitespace-nowrap">⚙️ Activités</button>
        <button id="btnTab3" onclick="switchTab('live')" class="px-4 py-2 text-slate-500 whitespace-nowrap">📊 Résultats Live</button>
    </nav>

    <div class="space-y-6">
        
        <!-- ONGLET 1 : ADMINISTRATION -->
        <div id="viewAdmin" class="space-y-4">
            <!-- Imports et grille des élèves (contenu inchangé) -->
        </div>

        <!-- ONGLET 2 : ACTIVITÉS -->
        <div id="viewActivities" class="hidden space-y-4">
            <!-- Sélecteur de discipline -->
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                <h3 class="font-black text-blue-400 uppercase text-sm mb-4">Quelle activité ?</h3>
                <div id="disciplineSelector" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <button onclick="switchDiscipline('sprint')" id="btnDisc-sprint" class="bg-slate-900 border-2 border-blue-500 p-6 rounded-2xl font-black text-center text-sm uppercase text-blue-400 active:scale-95 transition-transform">🏃 Sprint</button>
                    <button onclick="switchDiscipline('co')" id="btnDisc-co" class="bg-slate-900 border-2 border-slate-600 p-6 rounded-2xl font-black text-center text-sm uppercase text-slate-400 active:scale-95 transition-transform">🧭 CO</button>
                    <button onclick="switchDiscipline('arcathlon')" id="btnDisc-arcathlon" class="bg-slate-900 border-2 border-slate-600 p-6 rounded-2xl font-black text-center text-sm uppercase text-slate-400 active:scale-95 transition-transform">🎯 Arcathlon</button>
                    <button onclick="switchDiscipline('escalade')" id="btnDisc-escalade" class="bg-slate-900 border-2 border-slate-600 p-6 rounded-2xl font-black text-center text-sm uppercase text-slate-400 active:scale-95 transition-transform">⛰️ Escalade</button>
                </div>
            </div>

            <!-- Paramètres Sprint -->
            <div id="viewSprintSettings" class="space-y-4">
                <!-- Configuration, palette et génération d'équipes (contenu inchangé) -->
            </div>

            <!-- Paramètres CO -->
            <div id="viewCOSettings" class="hidden space-y-4">
                <!-- Circuits CO -->
            </div>
        </div>

        <!-- ONGLET 3 : LIVE -->
        <div id="viewLive" class="hidden space-y-4">
            <!-- Résultats en direct -->
        </div>
    </div>

    <script type="module">
        import { initApp } from './src/js/app.js';
        initApp();
    </script>
</body>
</html>
