<!DOCTYPE html>
<html lang="fr">
    <style>
    body { overflow-x: hidden; }
    /* On enlève la hauteur forcée pour que l'écran s'adapte au contenu */
    #activity-screen { min-height: auto; }

    /* ==== THÈME CLAIR — lisibilité plein soleil ==== */
    html { font-size: 17px; }
    body { background: #f1f5f9 !important; color: #0f172a !important; }

    [class*="bg-slate-900"] { background-color: #f1f5f9 !important; }
    [class*="bg-slate-800"] { background-color: #ffffff !important; }
    [class*="bg-slate-700"] { background-color: #e2e8f0 !important; }
    [class*="bg-slate-600"] { background-color: #cbd5e1 !important; }

    .text-white { color: #0f172a !important; }
    .text-slate-100, .text-slate-200 { color: #0f172a !important; }
    .text-slate-300 { color: #1e293b !important; }
    .text-slate-400 { color: #475569 !important; }

    [class*="bg-blue-"].text-white,
    [class*="bg-emerald-"].text-white,
    [class*="bg-green-"].text-white,
    [class*="bg-red-"].text-white,
    [class*="bg-indigo-"].text-white,
    [class*="bg-amber-"].text-white,
    [class*="bg-orange-"].text-white,
    [class*="bg-rose-"].text-white,
    [class*="bg-pink-"].text-white,
    [class*="bg-cyan-"].text-white,
    [class*="bg-purple-"].text-white,
    [class*="bg-teal-"].text-white,
    [class*="bg-lime-"].text-white,
    [class*="bg-fuchsia-"].text-white,
    [class*="bg-sky-"].text-white,
    [class*="bg-violet-"].text-white,
    [class*="bg-yellow-"].text-white {
        color: #ffffff !important;
    }

    .border-slate-600, .border-slate-700, .border-slate-800, .border-slate-900 { border-color: #e2e8f0 !important; }
    .border-slate-500 { border-color: #cbd5e1 !important; }

    .text-\[9px\], .text-\[10px\], .text-\[11px\] { font-size: 12px !important; line-height: 1rem !important; }
</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>EPS-Arena | Élève</title>
    <link rel="icon" href="hub-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="hub-icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initApp } from './src/js/ui/eleve/eleve-app.js';
        initApp();
    </script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6 font-sans">
    <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-black text-blue-500 italic">EPS-Arena</h1>
    <div class="flex items-center gap-2">
        <input type="text" id="profCodeInput" placeholder="Code Prof"
               class="bg-slate-800 border border-slate-600 rounded px-2 py-1 text-xs font-bold text-white w-24">
        <select id="class-select" class="bg-slate-800 border border-slate-600 rounded-lg p-2 text-xs font-bold text-blue-400 outline-none">
            <option value="">-- Choisir la classe --</option>
        </select>
    </div>
</div>
    <div id="main-container" class="max-w-md mx-auto">
        <div id="waiting-screen" class="text-center py-20">
            <div class="text-6xl mb-6">⏳</div>
            <p class="text-slate-400 font-bold">En attente de l'activité du professeur...</p>
        </div>
        <div id="login-screen" class="hidden">
            <h2 id="activity-title" class="text-xl font-black text-center mb-6">Choisis ton code</h2>
            <div id="code-list" class="grid grid-cols-3 gap-3"></div>
        </div>
        <div id="activity-screen" class="hidden">
            <div class="flex justify-between items-center mb-6 bg-slate-800 p-4 rounded-2xl border border-slate-700">
    <div id="code-info">
        <h2 class="text-xs uppercase text-slate-400 font-bold">Code sélectionné</h2>
        <span id="selected-code" class="text-3xl font-black text-blue-400">--</span>
    </div>
    <button onclick="location.reload()" id="btn-quit" class="bg-red-600 px-4 py-2 rounded-xl font-bold text-xs text-white active:scale-95">✖ Quitter</button>
    <button onclick="window.retourTerrains()" id="btn-back-terrain" class="hidden bg-slate-600 px-4 py-2 rounded-xl font-bold text-xs text-white active:scale-95">← Retour Terrains</button>
</div>
            <!-- MODULE ORIENTSHOW -->
<div id="orientshow-module" class="hidden space-y-4">
    <div id="os-identity-selector" class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
        <!-- Rempli par le script -->
    </div>
    <div id="os-circuit-grid" class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
        <!-- Rempli par le script -->
    </div>
    <div id="os-letters-input" class="hidden bg-slate-800 p-4 rounded-2xl border border-slate-700">
        <div class="flex justify-center gap-4">
            <input type="text" id="os-l1" class="input-box w-16 h-16 text-center text-3xl font-black uppercase" maxlength="1" oninput="this.value=this.value.toUpperCase(); if(this.value) document.getElementById('os-l2').focus()">
            <input type="text" id="os-l2" class="input-box w-16 h-16 text-center text-3xl font-black uppercase" maxlength="1" oninput="this.value=this.value.toUpperCase()">
        </div>
        <button onclick="window.validateOSPassage()" class="w-full mt-4 py-4 bg-blue-600 rounded-xl font-black text-xl uppercase">✅ Valider</button>
    </div>
</div>
<!-- MODULE RELAIS -->
<div id="relais-module" class="hidden space-y-4"></div>
<!-- MODULE 1/2 FOND -->
<div id="demi-fond-module" class="hidden space-y-4"></div>
<!-- MODULE SUIVI DES RÉALISATIONS (escale/bloc) -->
<div id="suivi-module" class="hidden space-y-4"></div>
<!-- MODULE GRILLES (auto-évaluation) -->
<div id="grilles-module" class="hidden space-y-4"></div>
<!-- MODULE NATATION -->
<div id="natation-module" class="hidden space-y-4">
    <!-- Rempli dynamiquement -->
</div>
<!-- MODULE ESCALADE -->
            <div id="escalade-module" class="hidden space-y-4">
                <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                    <label class="text-xs font-bold text-slate-400 uppercase">N° Voie (1 à 21)</label>
                    <select id="voie-select" class="w-full bg-slate-900 p-3 rounded-xl text-white text-2xl font-black mb-4 border border-slate-600">
                        <script>for(let i = 1; i <= 21; i++) document.write(`<option value="${i}">Voie ${i}</option>`);</script>
                    </select>
                    <label class="text-xs font-bold text-slate-400 uppercase">Couleur des prises</label>
                    <select id="couleur-select" class="w-full bg-slate-900 p-3 rounded-xl text-white mb-4 border border-slate-600">
                        <option value="bleue">Bleue</option><option value="rouge">Rouge</option><option value="verte">Verte</option><option value="jaune">Jaune</option><option value="rose">Rose</option><option value="orange">Orange</option><option value="sable">Sable</option><option value="tc">TC</option>
                    </select>
                    <label class="text-xs font-bold text-slate-400 uppercase">Hauteur grimpée (m)</label>
                    <select id="hauteur-select" class="w-full bg-slate-900 p-3 rounded-xl text-white text-2xl font-black mb-4 border border-slate-600">
                        <option value="3">3m (Bloc)</option><option value="4">4m</option><option value="5">5m</option><option value="6">6m</option><option value="7">7m</option><option value="8">8m</option><option value="9" selected>9m (Top)</option>
                    </select>
                    <label class="text-xs font-bold text-slate-400 uppercase">Cotation (Points)</label>
                    <div id="cotation-grid" class="grid grid-cols-5 gap-2 mb-4"></div>
                    <button onclick="window.sendEscalade()" class="w-full bg-emerald-600 py-5 rounded-3xl text-xl font-black uppercase shadow-xl active:scale-95 transition-all">📤 Envoyer la montée</button>
                </div>
            </div>
            <!-- MODULE CO -->
            <div id="co-module" class="hidden space-y-4">
                <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                    <label class="text-xs font-bold text-slate-400 uppercase">Numéro de balise</label>
                    <input type="text" id="balise-input" placeholder="Ex: 31, 45..." class="w-full bg-slate-900 p-4 rounded-xl text-white text-2xl font-black text-center mb-4 border border-slate-600">
                    <button onclick="window.sendBalise()" class="w-full bg-blue-600 py-5 rounded-3xl text-xl font-black uppercase shadow-xl active:scale-95 transition-all">✅ Valider</button>
                </div>
            </div>
                        <!-- MODULE MULTI -->
            <div id="multi-module" class="hidden space-y-4">
                <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 text-center">
                    <div id="chrono-display" class="text-8xl font-black tabular-nums text-yellow-400 mb-8">00:00</div>
                    <button id="start-btn" onclick="window.startChrono()" class="w-full bg-emerald-600 py-5 rounded-3xl text-2xl font-black uppercase shadow-xl active:scale-95 transition-all mb-2">▶ Démarrer</button>
                    <button id="stop-btn" onclick="window.stopChrono()" class="hidden w-full bg-red-600 py-5 rounded-3xl text-2xl font-black uppercase shadow-xl active:scale-95 transition-all">⏹ Arrêter</button>
                </div>
            </div>

            <!-- MODULE BADMINTON (Déplacé ICI, à l'intérieur de activity-screen) -->
            <div id="badminton-module" class="hidden space-y-4">
                <div id="badminton-content" class="space-y-4"></div>
            </div>

        </div> <!-- Fin de activity-screen -->
    </div> <!-- Fin du conteneur principal -->
    <!-- Zone de débogage (visible uniquement en développement) -->
<div id="debug-console" style="position: fixed; bottom: 0; left: 0; right: 0; max-height: 200px; overflow-y: auto; background: rgba(0,0,0,0.9); color: #0f0; font-size: 12px; padding: 8px; z-index: 9999; display: none; pointer-events: none; font-family: monospace; border-top: 2px solid #333;">
    <div style="display: flex; justify-content: space-between; pointer-events: auto;">
        <span style="font-weight: bold;">🔍 Logs de débogage</span>
        <button onclick="this.parentElement.parentElement.style.display='none'" style="background: #444; color: #fff; border: none; border-radius: 4px; padding: 2px 8px;">✕</button>
    </div>
    <div id="debug-logs" style="white-space: pre-wrap; word-break: break-all;"></div>
</div>
<button onclick="document.getElementById('debug-console').style.display='block'" style="position: fixed; bottom: 10px; right: 10px; z-index: 9999; background: #333; color: #fff; border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 20px; cursor: pointer;">🐞</button>
</body>
</html>
